<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EstimTransfert — Téléchargement</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="client-download-body">
  <main class="download-shell client-download-shell">
    <section class="download-page client-download-page">

      <div class="client-logo-circle">
        <img class="download-logo" src="../assets/img/logo-estimprim.png" alt="Estimprim">
      </div>

      <div class="client-download-grid">

        <div class="download-card client-download-card">
          <div id="loading" class="loading">Chargement du transfert…</div>

          <div id="transferContent" hidden>
            <div class="download-orbit">↓</div>
            <h1>Un transfert pour vous</h1>
            <p id="senderText">Estimprim vous a envoyé des fichiers.</p>
            <div id="summary" class="transfer-summary"></div>
            <div id="messageBox" class="message-box" hidden></div>
            <div id="clientFileList" class="client-file-list"></div>
            <button id="downloadAllBtn" class="primary-btn">TÉLÉCHARGER LES FICHIERS</button>
            <div id="expiryNote" class="expiry-note"></div>
          </div>

          <div id="transferError" hidden>
            <div class="download-orbit">!</div>
            <h1>Transfert indisponible</h1>
            <p id="transferErrorText">Ce lien n'est plus disponible.</p>
          </div>
        </div>

        <aside class="client-slideshow" aria-label="Galerie Estimprim">
          <div id="clientSlideshowPhoto" class="client-slideshow-photo" aria-hidden="true"></div>

          <div id="clientSlideshowPlaceholder" class="client-slideshow-placeholder">
            <div>
              <strong>ESTIMPRIM</strong>
              <span>Galerie photos</span>
              <small>Chargement des photos…</small>
            </div>
          </div>

          <div class="client-slideshow-caption">
            <strong></strong>
            <span></span>
          </div>
        </aside>

      </div>

      <footer class="footer">© Estimprim</footer>
    </section>
  </main>

  <!-- Le diaporama est volontairement indépendant de transfer.js -->
  <script>
    (function () {
      const PHOTOS = [
        '490284490_1210058121123539_7212564635273295740_n.jpg',
        '487320947_1200779785384706_6430073320876924404_n.jpg',
        '487827807_1198607225601962_7083852209065370242_n.jpg',
        '486616311_1197701002359251_7907232365323934613_n.jpg',
        '493153602_1227443599384991_3476029885905123400_n.jpg',
        '482359928_1183613547101330_5835285409625085282_n.jpg',
        '476886992_9818853528151798_7740103691228781286_n.jpg',
        '486955637_1197117682417583_7578840066891000458_n.jpg',
        '494183660_1228163219313029_7290334784527927853_n.jpg',
        '495211068_1236273925168625_7401350350301709400_n.jpg',
        '490346411_1212117794250905_3942573189948830419_n.jpg',
        '473174644_1117451139759220_3743156846620643893_n.jpg',
        '489817902_1209515494511135_6960883644503999787_n.jpg',
        '1782642603850.jpeg',
        '1756732476811.jpeg',
        '1762945013750.jpeg'
      ];

      const photoLayer = document.getElementById('clientSlideshowPhoto');
      const placeholder = document.getElementById('clientSlideshowPlaceholder');

      if (!photoLayer || !placeholder || !PHOTOS.length) return;

      // Mélange aléatoire à chaque ouverture de la page.
      const photos = PHOTOS.slice();
      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = photos[i];
        photos[i] = photos[j];
        photos[j] = tmp;
      }

      // Construit le chemin à partir de l'URL réelle de la page GitHub Pages.
      // Cela conserve automatiquement le nom du dépôt dans l'URL.
      const slideshowBase = new URL('../assets/img/slideshow/', window.location.href);

      let index = 0;
      let failedCount = 0;
      let timer = null;

      function scheduleNext() {
        window.clearTimeout(timer);
        timer = window.setTimeout(showNext, 5200);
      }

      function showNext() {
        if (!photos.length) return;

        const fileName = photos[index];
        index = (index + 1) % photos.length;

        const url = new URL(fileName, slideshowBase).href;
        const preloader = new Image();

        preloader.onload = function () {
          failedCount = 0;

          photoLayer.classList.remove('is-visible');

          window.setTimeout(function () {
            photoLayer.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
            placeholder.style.display = 'none';

            window.requestAnimationFrame(function () {
              photoLayer.classList.add('is-visible');
            });

            scheduleNext();
          }, 220);
        };

        preloader.onerror = function () {
          console.warn('EstimTransfert : photo introuvable', url);
          failedCount += 1;

          if (failedCount < photos.length) {
            window.setTimeout(showNext, 100);
          } else {
            placeholder.style.display = 'flex';
            const small = placeholder.querySelector('small');
            if (small) small.textContent = 'Aucune photo accessible dans assets/img/slideshow/';
          }
        };

        preloader.src = url;
      }

      showNext();
    })();
  </script>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/transfer.js"></script>
</body>
</html>
