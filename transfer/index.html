<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EstimTransfert — Téléchargement</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="download-shell">
    <section class="download-page">
      <img class="download-logo" src="../assets/img/logo-estimprim.png" alt="Estimprim">

      <div class="download-card">
        <div id="loading" class="loading">Chargement du transfert…</div>

        <div id="transferContent" hidden>
          <div class="download-orbit">↓</div>
          <h1>Un transfert pour vous</h1>
          <p id="senderText">Estimprim vous a envoyé des fichiers.</p>
          <div id="summary" class="transfer-summary"></div>
          <div id="messageBox" class="message-box" hidden></div>
          <div id="clientFileList" class="client-file-list"></div>
          <button id="downloadAllBtn" class="primary-btn">TÉLÉCHARGER LES FICHIERS</button>
          <div id="expiryNote" class="expiry-note"></div>
        </div>

        <div id="transferError" hidden>
          <div class="download-orbit">!</div>
          <h1>Transfert indisponible</h1>
          <p id="transferErrorText">Ce lien n'est plus disponible.</p>
        </div>
      </div>

      <footer class="footer">© Estimprim</footer>
    </section>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/transfer.js"></script>
</body>
</html>
